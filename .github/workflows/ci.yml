# iodesystems shared CI gate (canon X-CI-1): lint -> test -> build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml
      # The SPA is no longer embedded (WEB-5) — it ships beside the binary and
      # is installed by bin/deploy. Built here to gate the UI on every push,
      # and because ui/dist is gitignored.
      - name: build ui
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint run ./...
      - name: test
        run: go test ./...
      - name: build
        run: go build ./...
