# iodesystems shared CI gate (canon X-CI-1): lint -> test -> build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml
      # Built here to gate the UI on every push, because ui/dist is gitignored,
      # and because release builds compile it into the binary.
      - name: build ui
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
          golangci-lint run ./...
      - name: test
        run: go test ./...
      - name: build
        run: go build ./...

      # The release build is a different compilation: the embed_on.go files
      # behind the hzembed/uiembed tags are not type-checked by anything above,
      # so a broken embed would otherwise surface only while cutting a release.
      - name: build + test release tags
        run: |
          make ui-embed hz-embed
          go build -tags hzembed,uiembed ./cmd/homelab-horizon
          go test -tags hzembed,uiembed ./internal/server/ -run 'TestSPA|TestEmbeddedUI'
